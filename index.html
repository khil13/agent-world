<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent World</title>
<meta name="description" content="A 3D world of the agents behind my GitHub repos: who is working, who is asleep and what needs attention.">
<meta name="theme-color" content="#17181d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2317181d%27/%3E%3Cpath d=%27M16 5l9 5v12l-9 5-9-5V10z%27 fill=%27none%27 stroke=%27%2359d6ff%27 stroke-width=%272.5%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273.5%27 fill=%27%23ff9a3a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="brand">AGENT_WORLD</div>
  <div class="grow"></div>
  <span class="demotag" id="demoTag" title="The tasks on the CRM islands are invented to try out the world. Remove ?demo=tasks from the address to see the real world." hidden>demo tasks · invented</span>
  <span class="meta" id="meta"></span>
  <button class="btn" id="btnDormant">dormant: hidden</button>
  <button class="btn adminbadge" id="btnAdmin" title="Sign out of admin" hidden>admin · sign out</button>
  <button class="btn" id="btnFx" title="Ambient occlusion, bloom and depth blur. Turn off if the world feels slow.">fx: on</button>
  <button class="btn" id="btnFit">fit</button>
  <span class="meta" id="sync">loading…</span>
</header>
<div class="banner" id="banner" hidden></div>
<main class="stage" id="stage">
  <div class="labels" id="labels" aria-hidden="true"></div>
  <nav class="tools" aria-label="View controls">
    <button id="tbFit" title="Frame the whole world" aria-label="Fit">⌂</button>
    <button id="tbIn" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="tbOut" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="tbDormant" title="Show or hide quiet repos" aria-label="Dormant repos">☾</button>
  </nav>
  <aside class="card" id="card" hidden></aside>
  <aside class="drawer" id="drawer" aria-label="Task details" hidden></aside>
  <section class="feed collapsed" id="feed" aria-label="Activity feed">
    <button class="ph" id="feedToggle" type="button" aria-expanded="false">
      <span>Activity · last 24h replay</span><span class="badge" id="feedBadge" hidden></span><span class="chev">▴</span>
    </button>
    <p class="empty" hidden>Quiet day: no commits or runs in the last 24 hours.</p>
    <ul class="feed-list"></ul>
  </section>
  <aside class="side" id="side" aria-label="Repos and agents"></aside>
</main>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
